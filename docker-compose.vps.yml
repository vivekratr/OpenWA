# VPS stack: OpenWA API + PostgreSQL + Redis
# Pull-only hosts (Hostinger etc.) need the GHCR image — built by .github/workflows/publish-vps-image.yml
# Local/SSH: docker compose -f docker-compose.vps.yml up -d --build
#
# Setup:
#   cp .env.vps.example .env
#   # edit .env (DATABASE_PASSWORD, CORS_ORIGINS)
#   docker compose -f docker-compose.vps.yml up -d

services:
  openwa-api:
    image: ghcr.io/vivekratr/openwa-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openwa-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-2785}:2785"
    env_file:
      - .env
    environment:
      # ponytail: force VPS stack — don't rely on .env.example (sqlite/localhost)
      PORT: 2785
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-openwa}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-openwa}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_SYNCHRONIZE: "false"
      REDIS_ENABLED: "true"
      QUEUE_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DATA_PATH: /app/data/sessions
      STORAGE_LOCAL_PATH: /app/data/media
    volumes:
      - openwa-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:2785/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: openwa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-openwa}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      POSTGRES_DB: ${DATABASE_NAME:-openwa}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME:-openwa} -d ${DATABASE_NAME:-openwa}']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openwa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  openwa-data:
  postgres-data:
  redis-data:
